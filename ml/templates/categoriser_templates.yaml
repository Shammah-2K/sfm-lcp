# Templates and word lists for the synthetic categoriser corpus (make_corpus.py).
#
# DRAFT written with AI assistance (Claude Code, 2 Nov 2026). Shammah reviews and
# edits every line from local knowledge, then sets `reviewed: true` below. Until
# then every generated row and every model trained on it is marked as a draft.
# Record the review in the AI assistance log.
#
# Rules (BUILD_PROTOTYPE.md section 4, Chapter 3 Dataset Construction):
#   * English descriptions with local nouns; no code-switched sentences.
#   * Write what a trader would type into the description box: short, plain.
#   * Each line under a category is one template. Training and testing are split
#     BY TEMPLATE, so a held-out template is a phrasing the model never saw.
#     Vary the wording between templates; near-duplicates make the test easy.
#   * {slot} names must exist under `slots`. A template may use several slots.
#   * Categories must be exactly the 11 codes of the app codebook.

version: templates-v2
reviewed: false


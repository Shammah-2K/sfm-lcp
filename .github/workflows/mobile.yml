name: mobile

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: No raw participant data in the repository
        working-directory: .
        run: |
          if git ls-files | grep -E '^ml/data/raw/'; then
            echo "Raw participant data must never be committed." >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

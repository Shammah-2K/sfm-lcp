<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFM-LCP Study Dashboard</title>
<!--
  FR10 / UC12: a read-only view of the records phones have synced, for the
  researcher. Opens straight from disk (file://) or from any static host.
  Sign-in is a Supabase email account listed in public.researcher; see
  ../backend/supabase/migrations/20261029000000_dashboard.sql.
  Participant text is only ever inserted as text (textContent), never HTML.
-->
<style>
  :root {
    --surface: #f7f7f5; --card: #ffffff; --ink: #1c1c1a; --ink-2: #4d4d49; --muted: #6b6b66;
    --line: #e2e2dd; --brand: #1e3a8a; --brand-tint: #e8edf8;
    --in: #0d9488; --out: #c2410c; --in-text: #0f766e; --out-text: #c2410c;
    --attention: #fdf3d7; --focus: #1e3a8a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1a1a19; --card: #232322; --ink: #f2f2ef; --ink-2: #c9c9c4; --muted: #a3a39d;
      --line: #3a3a37; --brand: #9db4ef; --brand-tint: #2a3350;
      --in: #139a8d; --out: #d2541a; --in-text: #4fd1c1; --out-text: #f2915c;
      --attention: #3d3418; --focus: #9db4ef;
    }
  }
  :root[data-theme="dark"] {
    --surface: #1a1a19; --card: #232322; --ink: #f2f2ef; --ink-2: #c9c9c4; --muted: #a3a39d;
    --line: #3a3a37; --brand: #9db4ef; --brand-tint: #2a3350;
    --in: #139a8d; --out: #d2541a; --in-text: #4fd1c1; --out-text: #f2915c;
    --attention: #3d3418; --focus: #9db4ef;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 15px/1.45 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px;
           border-bottom: 1px solid var(--line); background: var(--card); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
  header .who { color: var(--muted); font-size: 13px; }
  main { max-width: 1120px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 17px; margin: 24px 0 10px; }
  h3 { font-size: 15px; margin: 18px 0 8px; }
  button, input { font: inherit; }
  button { border: 1px solid var(--line); background: var(--card); color: var(--ink);
           border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--brand); border-color: var(--brand); color: var(--card); }
  button:focus-visible, input:focus-visible, tr:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .note { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .tile .label { color: var(--muted); font-size: 13px; }
  .tile .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .in { color: var(--in-text); } .out { color: var(--out-text); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num, th.num { text-align: right; }
  td.wrap { white-space: normal; min-width: 180px; }
  tbody tr.link { cursor: pointer; }
  tbody tr.link:hover { background: var(--brand-tint); }
  .pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px;
          background: var(--brand-tint); color: var(--ink); }
  .pill.attention { background: var(--attention); border: 1px solid var(--ink); }
  .muted { color: var(--muted); }
  .struck { text-decoration: line-through; color: var(--muted); }
  form.signin { max-width: 360px; margin: 40px auto; display: grid; gap: 10px; }
  form.signin input { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
                      background: var(--card); color: var(--ink); }
  .error { color: var(--out-text); }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin: 4px 0 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px;
              vertical-align: -1px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; }
  a { color: var(--brand); }
  .chart .tip { position: absolute; pointer-events: none; background: var(--card); color: var(--ink);
                border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px;
                box-shadow: 0 2px 8px rgb(0 0 0 / 0.15); white-space: nowrap; display: none; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
</style>
</head>
<body>
<header>
  <h1>SFM-LCP study dashboard</h1>
  <span class="who" id="who"></span>
  <button id="refresh" hidden>Refresh</button>
  <button id="signout" hidden>Sign out</button>
</header>
<main id="main"><p class="note">Loading…</p></main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
'use strict';

// ------------------------------------------------------------- formatting
const lusakaDateTime = new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Africa/Lusaka', day: '2-digit', month: 'short', year: 'numeric',
  hour: '2-digit', minute: '2-digit',
});
const lusakaDate = new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Africa/Lusaka', day: '2-digit', month: 'short', year: 'numeric',
});
const grouped = new Intl.NumberFormat('en-US');

/** Integer ngwee to "K1,234.50"; a true minus sign for negatives. */
function kwacha(ngwee) {
  const n = Number(ngwee || 0);
  const abs = Math.abs(n);
  return (n < 0 ? '−' : '') + 'K' + grouped.format(Math.floor(abs / 100)) + '.' +
    String(abs % 100).padStart(2, '0');
}
const atMs = (ms) => (ms == null ? '—' : lusakaDateTime.format(new Date(Number(ms))));
const atTs = (ts) => (ts == null ? '—' : lusakaDateTime.format(new Date(ts)));
const day = (iso) => lusakaDate.format(new Date(iso + 'T12:00:00+02:00'));
const businessTypes = { market_stall: 'Market stall', shop: 'Shop', service: 'Service', other: 'Other' };

/** Builds an element. Children that are strings become text nodes. */
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (k === 'class') node.className = v;
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

function table(headers, rows, opts = {}) {
  return el('div', { class: 'scroll' },
    el('table', {},
      el('thead', {}, el('tr', {}, headers.map((h) =>
        el('th', { class: h.num ? 'num' : null }, h.label)))),
      el('tbody', {}, rows.length ? rows : el('tr', {},
        el('td', { colspan: headers.length, class: 'muted' }, opts.empty || 'Nothing yet')))));
}

const tile = (label, value, cls) =>
  el('div', { class: 'card tile' }, el('div', { class: 'label' }, label),
    el('div', { class: 'value ' + (cls || '') }, value));

// --------------------------------------------------------------- supabase
const main = document.getElementById('main');
const cfg = window.SFM_CONFIG;
if (!cfg || !cfg.url || !cfg.key || cfg.key.includes('...')) {
  main.replaceChildren(el('div', { class: 'card' },
    el('h2', {}, 'Not set up'),
    el('p', {}, 'Copy dashboard/config.example.js to dashboard/config.js and fill in the ',
      'Project URL and publishable key. See dashboard/README.md.')));
  throw new Error('config.js missing');
}
const db = window.supabase.createClient(cfg.url, cfg.key);

async function rows(query) {
  const { data, error } = await query;
  if (error) throw new Error(error.message);
  return data;
}

// ---------------------------------------------------------------- sign-in
function showSignIn(message) {
  document.getElementById('who').textContent = '';
  document.getElementById('signout').hidden = true;
  document.getElementById('refresh').hidden = true;
  const email = el('input', { type: 'email', placeholder: 'Email', autocomplete: 'username', required: true });
  const password = el('input', { type: 'password', placeholder: 'Password',
    autocomplete: 'current-password', required: true });
  const status = el('p', { class: 'error', role: 'alert' }, message || '');
  main.replaceChildren(el('form', {
    class: 'signin card',
    onsubmit: async (e) => {
      e.preventDefault();
      status.textContent = 'Signing in…';
      const { error } = await db.auth.signInWithPassword({ email: email.value, password: password.value });
      if (error) status.textContent = error.message;
    },
  }, el('h2', {}, 'Researcher sign-in'), email, password,
     el('button', { class: 'primary', type: 'submit' }, 'Sign in'), status));
  email.focus();
}

document.getElementById('signout').addEventListener('click', () => db.auth.signOut());
document.getElementById('refresh').addEventListener('click', () => route());
db.auth.onAuthStateChange((_event, session) => {
  if (!session) showSignIn();
  else if (_event === 'SIGNED_IN' || _event === 'INITIAL_SESSION') route();
});

window.addEventListener('hashchange', () => route());

async function route() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return showSignIn();
  document.getElementById('who').textContent = session.user.email || '';
  document.getElementById('signout').hidden = false;
  document.getElementById('refresh').hidden = false;
  main.replaceChildren(el('p', { class: 'note' }, 'Loading…'));
  try {
    const { data: ok, error } = await db.rpc('is_researcher');
    if (error) throw new Error(error.message);
    if (!ok) {
      main.replaceChildren(el('div', { class: 'card' },
        el('h2', {}, 'Not on the researcher list'),
        el('p', {}, 'This account can sign in but cannot read study data. Add it in the Supabase SQL editor:'),
        el('pre', {}, "insert into public.researcher (user_id)\nselect id from auth.users where email = '" +
          (session.user.email || 'you@example.com') + "';")));
      return;
    }
    const code = decodeURIComponent(location.hash.replace(/^#p=/, ''));
    if (location.hash.startsWith('#p=') && code) await showParticipant(code);
    else await showOverview();
  } catch (e) {
    main.replaceChildren(el('p', { class: 'error', role: 'alert' }, 'Could not load: ' + e.message));
  }
}

// --------------------------------------------------------------- overview
function statusOf(p) {
  if (p.withdrawn_at) return el('span', { class: 'pill' }, 'Withdrawn');
  if (!p.claimed_at) return el('span', { class: 'muted' }, 'Not started');
  if (!p.business_id) return el('span', { class: 'pill' }, 'Claimed, nothing synced');
  return el('span', { class: 'pill' }, 'Taking part');
}

async function showOverview() {
  const people = await rows(db.from('dash_participant').select('*').order('participant_code'));
  const started = people.filter((p) => p.claimed_at);
  const withdrawn = people.filter((p) => p.withdrawn_at);
  const entries = people.reduce((s, p) => s + Number(p.entries), 0);
  const last = people.map((p) => p.last_received_at).filter(Boolean).sort().at(-1);

  main.replaceChildren(
    el('p', { class: 'note' },
      'Read-only copy of what phones have synced. Amounts are exact; round any figure you publish (D7). ',
      'Times are Lusaka time.'),
    el('div', { class: 'tiles' },
      tile('Codes issued', people.length),
      tile('Started', started.length),
      tile('Withdrew', withdrawn.length),
      tile('Entries received', grouped.format(entries)),
      tile('Last record received', last ? atTs(last) : '—')),
    el('h2', {}, 'Participants'),
    el('div', { class: 'card' }, table(
      [{ label: 'Code' }, { label: 'Status' }, { label: 'Business' }, { label: 'Started' },
       { label: 'Entries', num: true }, { label: 'Cancelled', num: true },
       { label: 'Money in', num: true }, { label: 'Money out', num: true },
       { label: 'Unusual', num: true }, { label: 'Last received' }],
      people.map((p) => {
        const open = () => { location.hash = 'p=' + encodeURIComponent(p.participant_code); };
        return el('tr', {
          class: p.business_id ? 'link' : null,
          tabindex: p.business_id ? '0' : null,
          onclick: p.business_id ? open : null,
          onkeydown: p.business_id ? (e) => { if (e.key === 'Enter') open(); } : null,
        },
        el('td', {}, el('strong', {}, p.participant_code)),
        el('td', {}, statusOf(p)),
        el('td', {}, businessTypes[p.business_type] || '—'),
        el('td', {}, atTs(p.claimed_at)),
        el('td', { class: 'num' }, p.entries),
        el('td', { class: 'num' }, p.cancelled),
        el('td', { class: 'num in' }, p.business_id ? kwacha(p.in_ngwee) : '—'),
        el('td', { class: 'num out' }, p.business_id ? kwacha(p.out_ngwee) : '—'),
        el('td', { class: 'num' }, p.flagged),
        el('td', {}, atTs(p.last_received_at)));
      }), { empty: 'No participant codes yet. Run seed_codes.sql.' })),
    el('p', { class: 'note' }, 'Select a participant to see their records.'));
}

// ------------------------------------------------------------ participant
async function showParticipant(code) {
  const [person] = await rows(db.from('dash_participant').select('*').eq('participant_code', code));
  if (!person || !person.business_id) {
    main.replaceChildren(el('p', {}, 'No synced records for ', code, '. ',
      el('a', { href: '#' }, 'Back to participants')));
    return;
  }
  const biz = person.business_id;
  const [daily, cats, stock, ledger] = await Promise.all([
    rows(db.from('dash_daily').select('*').eq('business_id', biz).order('day')),
    rows(db.from('dash_category').select('*').eq('business_id', biz).order('amount_ngwee', { ascending: false })),
    rows(db.from('dash_stock').select('*').eq('business_id', biz).order('name')),
    rows(db.from('ledger_entry').select('*').eq('business_id', biz)
      .order('occurred_at', { ascending: false }).limit(500)),
  ]);
  const cancelled = new Set(ledger.filter((e) => e.reverses_id).map((e) => e.reverses_id));

  main.replaceChildren(
    el('p', {}, el('a', { href: '#' }, '← All participants')),
    el('div', { class: 'row' }, el('h2', { style: 'margin:0' }, person.participant_code), statusOf(person),
      el('span', { class: 'muted' }, businessTypes[person.business_type] || '')),
    el('div', { class: 'tiles', style: 'margin-top:12px' },
      tile('Money in', kwacha(person.in_ngwee), 'in'),
      tile('Money out', kwacha(person.out_ngwee), 'out'),
      tile('Profit', kwacha(person.in_ngwee - person.out_ngwee)),
      tile('Entries', person.entries),
      tile('Last record received', atTs(person.last_received_at))),
    el('h2', {}, 'Money in and out by day'),
    el('div', { class: 'card' }, dailyChart(daily)),
    el('div', { class: 'grid2' },
      el('div', {}, el('h3', {}, 'By category'), el('div', { class: 'card' }, table(
        [{ label: 'Category' }, { label: 'Entries', num: true }, { label: 'Amount', num: true }],
        cats.map((c) => el('tr', {}, el('td', {}, c.name), el('td', { class: 'num' }, c.entries),
          el('td', { class: 'num ' + (c.kind === 'income' ? 'in' : 'out') }, kwacha(c.amount_ngwee))))))),
      el('div', {}, el('h3', {}, 'Stock'), el('div', { class: 'card' }, table(
        [{ label: 'Product' }, { label: 'Price', num: true }, { label: 'In stock', num: true }, { label: '' }],
        stock.map((s) => el('tr', {},
          el('td', { class: s.is_active ? null : 'muted' }, s.name),
          el('td', { class: 'num' }, kwacha(s.unit_price_ngwee)),
          el('td', { class: 'num' }, s.stock_qty),
          el('td', {}, !s.is_active ? el('span', { class: 'muted' }, 'Stopped selling')
            : s.stock_qty <= s.reorder_level ? el('span', { class: 'pill attention' }, 'Low') : ''))),
        { empty: 'No products' })))),
    el('h2', {}, 'Ledger'),
    el('p', { class: 'note' }, 'Newest first, up to 500. A cancelled entry is struck through; its reversal ',
      'is the matching negative row.'),
    el('div', { class: 'card' }, table(
      [{ label: 'When' }, { label: 'Type' }, { label: 'Amount', num: true }, { label: 'Category' },
       { label: 'Description' }, { label: 'Paid with' }, { label: '' }],
      ledger.map((e) => {
        const isIn = e.entry_type === 'sale';
        const struck = cancelled.has(e.id);
        return el('tr', {},
          el('td', {}, atMs(e.occurred_at)),
          el('td', {}, isIn ? 'Sale' : 'Expense'),
          el('td', { class: 'num ' + (struck ? 'struck' : isIn ? 'in' : 'out') },
            (isIn ? '+' : '−') + kwacha(Math.abs(e.amount_ngwee)).replace('−', '')),
          el('td', {}, e.final_category),
          el('td', { class: 'wrap' + (struck ? ' struck' : '') }, e.description || '—'),
          el('td', {}, e.payment_method === 'mobile_money' ? 'Mobile money' : 'Cash'),
          el('td', {},
            e.reverses_id ? el('span', { class: 'pill' }, 'Cancels an entry') : '',
            e.anomaly_flag ? el('span', { class: 'pill attention' },
              e.anomaly_reviewed_at ? 'Unusual, confirmed' : 'Unusual') : ''));
      }), { empty: 'No entries' })));
}

// ----------------------------------------------------------------- chart
// Two series, money in and money out, as grouped bars per Lusaka day. Colours
// validated with the dataviz palette checker (light and dark). Hover or focus
// a bar for its value; "Show as table" gives the same numbers as text.
function dailyChart(daily) {
  const days = daily.slice(-21);
  if (!days.length) return el('p', { class: 'muted' }, 'No entries yet');
  const wrap = el('div', { class: 'chart' });
  const tip = el('div', { class: 'tip', role: 'status' });
  const W = 720, H = 220, padL = 64, padR = 8, padT = 10, padB = 34;
  const max = Math.max(1, ...days.flatMap((d) => [d.in_ngwee, d.out_ngwee]));
  const step = niceStep(max / 4);
  const top = Math.ceil(max / step) * step;
  const y = (v) => padT + (H - padT - padB) * (1 - v / top);
  const band = (W - padL - padR) / days.length;
  const barW = Math.max(3, Math.min(22, (band - 10) / 2));
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Money in and money out per day');
  const add = (tag, attrs, text) => {
    const n = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    svg.append(n);
    return n;
  };
  for (let v = 0; v <= top; v += step) {
    add('line', { x1: padL, x2: W - padR, y1: y(v), y2: y(v), stroke: 'var(--line)', 'stroke-width': 1 });
    add('text', { x: padL - 8, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)' },
      kwacha(v).replace('.00', ''));
  }
  const labelEvery = Math.ceil(days.length / 8);
  days.forEach((d, i) => {
    const x0 = padL + band * i + (band - (barW * 2 + 2)) / 2;
    [['in_ngwee', 'var(--in)', 'Money in'], ['out_ngwee', 'var(--out)', 'Money out']].forEach(([k, color, name], j) => {
      const v = Number(d[k]);
      const h = Math.max(0, y(0) - y(v));
      const x = x0 + j * (barW + 2);
      // Rounded at the data end only, square on the baseline.
      const r = Math.min(4, barW / 2, h);
      const path = h <= 0 ? '' :
        `M${x},${y(0)} V${y(v) + r} Q${x},${y(v)} ${x + r},${y(v)} H${x + barW - r} ` +
        `Q${x + barW},${y(v)} ${x + barW},${y(v) + r} V${y(0)} Z`;
      if (path) add('path', { d: path, fill: color });
      const hit = add('rect', { x: x - 1, y: padT, width: barW + 2, height: H - padT - padB,
        fill: 'transparent', tabindex: 0, 'aria-label': `${day(d.day)}: ${name} ${kwacha(v)}` });
      const show = () => {
        tip.replaceChildren(el('strong', {}, day(d.day)), el('br'), `${name}: ${kwacha(v)}`);
        tip.style.display = 'block';
        const box = wrap.getBoundingClientRect();
        const hb = hit.getBoundingClientRect();
        tip.style.left = Math.min(box.width - 160, Math.max(0, hb.left - box.left - 40)) + 'px';
        tip.style.top = Math.max(0, hb.top - box.top + (y(v) - padT) * (hb.height / (H - padT - padB)) - 48) + 'px';
      };
      hit.addEventListener('mouseenter', show);
      hit.addEventListener('focus', show);
      hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
      hit.addEventListener('blur', () => { tip.style.display = 'none'; });
    });
    if (i % labelEvery === 0) {
      add('text', { x: padL + band * i + band / 2, y: H - padB + 16, 'text-anchor': 'middle',
        'font-size': 11, fill: 'var(--muted)' }, day(d.day).slice(0, 6));
    }
  });
  add('line', { x1: padL, x2: W - padR, y1: y(0), y2: y(0), stroke: 'var(--muted)', 'stroke-width': 1 });

  const asTable = table(
    [{ label: 'Day' }, { label: 'Money in', num: true }, { label: 'Money out', num: true },
     { label: 'Entries', num: true }],
    days.map((d) => el('tr', {}, el('td', {}, day(d.day)),
      el('td', { class: 'num in' }, kwacha(d.in_ngwee)), el('td', { class: 'num out' }, kwacha(d.out_ngwee)),
      el('td', { class: 'num' }, d.entries))));
  asTable.hidden = true;
  const toggle = el('button', { type: 'button', onclick: () => {
    asTable.hidden = !asTable.hidden;
    wrap.hidden = !asTable.hidden;
    toggle.textContent = asTable.hidden ? 'Show as table' : 'Show as chart';
  } }, 'Show as table');

  wrap.append(svg, tip);
  return el('div', {},
    el('div', { class: 'row', style: 'justify-content:space-between' },
      el('div', { class: 'legend' },
        el('span', {}, el('i', { style: 'background:var(--in)' }), 'Money in'),
        el('span', {}, el('i', { style: 'background:var(--out)' }), 'Money out')),
      toggle),
    el('p', { class: 'note', style: 'margin:0 0 6px' },
      days.length < daily.length ? `Last ${days.length} days with entries.` : 'Days with entries.'),
    wrap, asTable);
}

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1))));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p;
  return 10 * p;
}
